<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Critter Comforts</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #1a1a2e;
      width: 100%;
      height: 100%;
    }
    #app {
      width: 100%;
      height: 100%;
    }
    #hud {
      position: fixed;
      bottom: 18px;
      left: 18px;
      max-width: min(760px, calc(100vw - 36px));
      box-sizing: border-box;
      color: #fffdf7;
      font: 600 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0.01em;
      background: linear-gradient(135deg, rgba(28, 48, 45, 0.88), rgba(41, 61, 57, 0.76));
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 16px;
      padding: 11px 14px;
      box-shadow: 0 10px 30px rgba(14, 29, 27, 0.28), inset 0 1px rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px) saturate(1.15);
      -webkit-backdrop-filter: blur(12px) saturate(1.15);
      pointer-events: none;
      user-select: none;
    }
    #hud .hud-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px 9px;
    }
    #hud .hud-row + .hud-row { margin-top: 7px; }
    #hud .hud-mode {
      display: inline-flex;
      align-items: center;
      min-height: 25px;
      padding: 0 9px;
      border-radius: 999px;
      color: #173c35;
      background: #dff3bb;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }
    #hud.is-editing .hud-mode {
      color: #4a2f0b;
      background: #ffd999;
    }
    #hud .hud-label { color: rgba(255, 253, 247, 0.72); }
    #hud .hud-divider {
      width: 1px;
      height: 17px;
      background: rgba(255, 255, 255, 0.24);
    }
    #hud kbd {
      display: inline-block;
      min-width: 17px;
      padding: 1px 5px 2px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-bottom-color: rgba(255, 255, 255, 0.18);
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.15);
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.18);
      color: #fff;
      font: 700 11px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace;
      text-align: center;
    }
    .cc-transform-box {
      position: fixed;
      z-index: 8;
      box-sizing: border-box;
      border: 2px solid rgba(255, 217, 153, 0.96);
      border-radius: 4px;
      box-shadow: 0 0 0 1px rgba(74, 47, 11, 0.72), 0 0 16px rgba(255, 217, 153, 0.28);
      pointer-events: none;
      user-select: none;
    }
    .cc-transform-box[hidden] { display: none; }
    .cc-transform-handle {
      position: absolute;
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      padding: 0;
      color: #4a2f0b;
      background: #ffd999;
      border: 2px solid #fff8e8;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(42, 28, 12, 0.34);
      font: 900 15px/1 -apple-system, BlinkMacSystemFont, "Segoe UI Symbol", sans-serif;
      pointer-events: auto;
      touch-action: none;
    }
    .cc-transform-handle:hover,
    .cc-transform-handle:focus-visible {
      background: #fff0bd;
      transform: translate(-50%, -50%) scale(1.12);
      outline: 2px solid rgba(74, 47, 11, 0.45);
    }
    .cc-transform-handle[data-handle="n"] { left: 50%; top: 0; cursor: ns-resize; transform: translate(-50%, -50%); }
    .cc-transform-handle[data-handle="s"] { left: 50%; top: 100%; cursor: ns-resize; transform: translate(-50%, -50%); }
    .cc-transform-handle[data-handle="e"] { left: 100%; top: 50%; cursor: ew-resize; transform: translate(-50%, -50%); }
    .cc-transform-handle[data-handle="w"] { left: 0; top: 50%; cursor: ew-resize; transform: translate(-50%, -50%); }
    .cc-transform-handle[data-handle="ne"] { left: 100%; top: 0; cursor: nesw-resize; transform: translate(-50%, -50%); }
    .cc-transform-handle[data-handle="nw"] { left: 0; top: 0; cursor: nwse-resize; transform: translate(-50%, -50%); }
    .cc-transform-handle[data-handle="se"] { left: 100%; top: 100%; cursor: nwse-resize; transform: translate(-50%, -50%); }
    .cc-transform-handle[data-handle="sw"] { left: 0; top: 100%; cursor: nesw-resize; transform: translate(-50%, -50%); }
    #cc-editor-palette {
      position: fixed;
      z-index: 9;
      top: 76px;
      right: 18px;
      width: 230px;
      max-height: calc(100vh - 112px);
      overflow: auto;
      box-sizing: border-box;
      padding: 13px;
      color: #fffdf7;
      background: linear-gradient(145deg, rgba(45, 61, 57, 0.94), rgba(29, 45, 42, 0.9));
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(14, 29, 27, 0.32);
      backdrop-filter: blur(12px) saturate(1.15);
      font: 600 12px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #cc-editor-palette[hidden] { display: none; }
    #cc-editor-palette h2, #cc-editor-palette h3 { margin: 0; }
    #cc-editor-palette h2 { font-size: 14px; letter-spacing: 0.04em; }
    #cc-editor-palette h3 { margin-top: 13px; color: #dff3bb; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; }
    .cc-palette-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    .cc-palette-row label { flex: 1; }
    #cc-object-color { width: 42px; height: 30px; padding: 2px; border: 0; border-radius: 8px; background: #fff8e8; }
    #cc-asset-name {
      min-width: 0;
      flex: 1;
      box-sizing: border-box;
      padding: 7px 8px;
      color: #263a36;
      background: #fff8e8;
      border: 1px solid rgba(255,255,255,.5);
      border-radius: 8px;
      font: inherit;
    }
    .cc-palette-button, .cc-object-item {
      box-sizing: border-box;
      border: 1px solid rgba(255,255,255,.28);
      border-radius: 9px;
      color: #243b36;
      background: #dff3bb;
      font: 700 12px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      cursor: pointer;
    }
    .cc-palette-button { padding: 8px 9px; }
    .cc-palette-button:disabled { cursor: default; opacity: .42; }
    #cc-object-list { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 8px; }
    .cc-object-item { min-height: 38px; padding: 7px; }
    .cc-object-item.is-saved { background: #ffd999; }
    .cc-palette-hint { margin-top: 7px; color: rgba(255,253,247,.68); font-size: 10px; }
    @media (max-width: 700px) {
      #hud { right: 12px; bottom: 12px; left: 12px; max-width: none; }
      #hud .hud-secondary { display: none; }
      #cc-editor-palette { top: 64px; right: 10px; width: 190px; }
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      color: #fff;
      font: 16px -apple-system, sans-serif;
      z-index: 10;
      transition: opacity 0.3s;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="loading">Loading Critter Comforts…</div>
  <div id="hud" aria-live="polite"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
