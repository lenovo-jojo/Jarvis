name: Verify companion source examples
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  browser-source:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project/examples/browser-world
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: project/examples/browser-world/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
  dialogue-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 project/examples/gamecube-dialogue/tests/run_checks.py
